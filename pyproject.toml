[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-job-market-analyzer"
version = "0.2.0"
description = "Analyze the worldwide-remote job market from public APIs, filter eligibility, score matches, and generate Excel dashboards."
readme = "README.md"
authors = [
    { name = "Nitesh Beniwal" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/NiteshBen/remote-job-market-analyzer"

[project.scripts]
jobmarket = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
